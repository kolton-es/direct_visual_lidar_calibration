name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore: '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          file: ${{github.workspace}}/Dockerfile
          context: .
          tags: direct_visual_lidar_calibration:latest
          push: false
